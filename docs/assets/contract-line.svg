<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" role="img" aria-labelledby="title desc">
  <title id="title">The Linebind contract line</title>
  <desc id="desc">Illustration using Linebind's five repository rules. All checks pass in the first row. A simulated forbidden exec.Command call crosses the native-package rule in the second row. Removing it restores the passing result in the third. This is not a live repository status.</desc>
  <style>
    :root{--paper:#f6f5f1;--ink:#252825;--muted:#666b65;--line:#d9ddd5;--crossed:#a33d2b}
    @media(prefers-color-scheme:dark){:root{--paper:#1b1e1c;--ink:#e9ede7;--muted:#a7afa5;--line:#454d43;--crossed:#f09c8b}}
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink)}
    .label{font-size:12px;fill:var(--muted)}.state{font-size:14px}.rail{stroke:var(--line);stroke-width:1}
    .bracket{stroke:var(--ink);stroke-width:1.5;fill:none}.point{fill:var(--ink)}.crossed{stroke:var(--crossed);fill:var(--crossed)}
  </style>
  <rect width="960" height="310" rx="6" fill="var(--paper)"/>
  <text x="32" y="37" font-size="13" letter-spacing="2">THE LINE</text>
  <text x="928" y="37" text-anchor="end" class="label">Your decisions. In view.</text>
  <g text-anchor="middle" class="label">
    <text x="320" y="72" class="label">01 · Docs</text><text x="450" y="72" class="label">02 · Dependencies</text>
    <text x="580" y="72" class="label">03 · Native checks</text><text x="710" y="72" class="label">04 · Agent skill</text><text x="840" y="72" class="label">05 · Offline report</text>
  </g>
  <text x="32" y="110" class="state">Within the contract</text>
  <path class="rail" d="M270 105H890"/><path class="bracket" d="M278 93H270V117H278M882 93H890V117H882"/>
  <g class="point"><circle cx="320" cy="105" r="4"/><circle cx="450" cy="105" r="4"/><circle cx="580" cy="105" r="4"/><circle cx="710" cy="105" r="4"/><circle cx="840" cy="105" r="4"/></g>
  <text x="32" y="180" class="state">One rule fails</text>
  <text x="32" y="199" class="label">exec.Command in native code</text>
  <path class="rail" d="M270 175H890"/><path class="bracket" d="M278 163H270V187H278M882 163H890V187H882"/>
  <g class="point"><circle cx="320" cy="175" r="4"/><circle cx="450" cy="175" r="4"/><circle cx="710" cy="175" r="4"/><circle cx="840" cy="175" r="4"/></g>
  <path class="crossed" d="M580 175V145" fill="none"/><path class="crossed" d="m580 137 5 5-5 5-5-5Z"/>
  <text x="32" y="245" class="state">After repair</text>
  <path class="rail" d="M270 240H890"/><path class="bracket" d="M278 228H270V252H278M882 228H890V252H882"/>
  <g class="point"><circle cx="320" cy="240" r="4"/><circle cx="450" cy="240" r="4"/><circle cx="580" cy="240" r="4"/><circle cx="710" cy="240" r="4"/><circle cx="840" cy="240" r="4"/></g>
  <text x="32" y="288" class="label">Illustration · simulated change on Linebind's five declared rules · not a live status</text>
</svg>
