<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Linebind report illustrated on a macOS-style desktop</title>
  <desc id="desc">Editorial illustration using a real frontend fixture result: the jquery dependency crosses the approved contract. This is not an operating-system screenshot.</desc>
  <defs>
    <linearGradient id="desktop" x1="0" y1="0" x2="1600" y2="1120" gradientUnits="userSpaceOnUse"><stop stop-color="#cad3cc"/><stop offset=".52" stop-color="#a5b6af"/><stop offset="1" stop-color="#6c8581"/></linearGradient>
    <linearGradient id="wave" x1="0" y1="1120" x2="1600" y2="200" gradientUnits="userSpaceOnUse"><stop stop-color="#e5e5d9"/><stop offset="1" stop-color="#d2d9ce" stop-opacity=".1"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%"><feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#213c35" flood-opacity=".23"/><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#213c35" flood-opacity=".1"/></filter>
    <clipPath id="window"><rect x="120" y="116" width="1360" height="872" rx="15"/></clipPath>
  </defs>
  <rect width="1600" height="1120" rx="24" fill="url(#desktop)"/>
  <path d="M-70 1030C260 770 350 320 790 350C1210 380 1100 870 1640 490V1190H-70Z" fill="url(#wave)"/>
  <path d="M-100 1170C280 780 340 170 820 220C1240 260 1170 690 1690 310" stroke="#f4f1e3" stroke-opacity=".23" stroke-width="2"/>
  <path d="M-100 1220C330 750 380 200 850 250C1260 295 1220 735 1720 355" stroke="#f4f1e3" stroke-opacity=".13" stroke-width="2"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" fill="#283a34">
    <rect x="0" y="0" width="1600" height="38" fill="#ebeee5" fill-opacity=".36"/>
    <path d="M36 12H32V27H36M43 12H47V27H43M29 20H50" fill="none" stroke="#283a34" stroke-width="1.5"/>
    <text x="70" y="25" font-size="14" font-weight="600">Linebind</text><text x="164" y="25" font-size="14">File</text><text x="211" y="25" font-size="14">Edit</text><text x="261" y="25" font-size="14">View</text><text x="319" y="25" font-size="14">Window</text>
    <text x="1488" y="25" font-size="14" text-anchor="end">Local report</text>
  </g>
  <rect x="120" y="116" width="1360" height="872" rx="15" fill="#f6f5f1" filter="url(#shadow)"/>
  <g clip-path="url(#window)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <rect x="120" y="116" width="1360" height="48" fill="#eceee8"/>
    <path d="M120 164H1480" stroke="#d4dad1"/>
    <circle cx="145" cy="140" r="6" fill="#df887d"/><circle cx="166" cy="140" r="6" fill="#dbbd71"/><circle cx="187" cy="140" r="6" fill="#92b18c"/>
    <rect x="570" y="127" width="460" height="26" rx="6" fill="#f8f9f4" stroke="#dfe3d9"/>
    <text x="800" y="145" fill="#70766b" font-size="12" text-anchor="middle">frontend · Linebind report</text>
    <g fill="#252825">
      <path d="M184 199H178V225H184M196 199H202V225H196M174 212H206" fill="none" stroke="#252825" stroke-width="2.2"/>
      <text x="221" y="223" font-size="30" letter-spacing="-1.1">linebind</text>
      <text x="1416" y="218" text-anchor="end" font-size="11" font-weight="600" letter-spacing="1.8" fill="#666b65">YOUR RULES. IN VIEW.</text>
      <path d="M174 248H1426" stroke="#d9ddd5"/>
      <path d="M177 280H182L185 283H193V293H177Z" fill="none" stroke="#666b65" stroke-width="1.3"/>
      <text x="205" y="292" font-size="14" font-weight="600">frontend</text><text x="273" y="292" font-size="14" fill="#666b65">/ local report</text>
      <text x="1425" y="291" text-anchor="end" font-size="12" font-family="'SFMono-Regular',Consolas,monospace" fill="#666b65">c2477455 → working tree</text>
      <circle cx="182" cy="339" r="5" fill="#a33d2b"/>
      <text x="203" y="354" font-size="43" font-weight="400" letter-spacing="-1.5">A boundary was crossed.</text>
      <text x="204" y="389" font-size="14" fill="#666b65">1 check declared     ·     1 crossed     ·     0 not verified</text>
      <rect x="1273" y="368" width="151" height="33" rx="5" fill="#f6f5f1" stroke="#c9d0c9"/>
      <rect x="1289" y="381" width="8" height="10" rx="1" fill="none" stroke="#666b65"/><path d="M1286 387V378H1293" stroke="#666b65"/>
      <text x="1309" y="389" font-size="12">Copy diagnostic</text>
    </g>
    <rect x="174" y="429" width="1252" height="430" rx="8" fill="#fffefa" stroke="#d9ddd5"/>
    <path d="M182 430H476V858H182Q175 858 175 851V437Q175 430 182 430Z" fill="#f1f2ed"/>
    <path d="M476 429V859" stroke="#d9ddd5"/>
    <g fill="#666b65">
      <text x="199" y="469" font-size="11" font-weight="600" letter-spacing="1.5">THE BOUNDARIES</text>
      <text x="450" y="469" text-anchor="end" font-size="12" font-family="'SFMono-Regular',Consolas,monospace">1</text>
      <rect x="188" y="489" width="273" height="106" rx="5" fill="#fffefa" stroke="#d4dad0"/>
      <path d="M188 504V579" stroke="#355c76" stroke-width="2"/>
      <text x="203" y="517" font-size="14" font-weight="600" fill="#252825">frontend.runtime-</text><text x="203" y="538" font-size="14" font-weight="600" fill="#252825">dependencies</text>
      <circle cx="207" cy="571" r="3" fill="#a33d2b"/><text x="218" y="575" font-size="12" fill="#a33d2b">Crossed</text><text x="445" y="575" font-size="12" text-anchor="end">Required</text>
      <path d="M201 627H447" stroke="#d9ddd5"/>
      <text x="201" y="652" font-size="12">Each check keeps its own evidence.</text><text x="201" y="675" font-size="12">Each result is scoped to its inputs.</text>
    </g>
    <g fill="#252825">
      <text x="514" y="469" font-family="'SFMono-Regular',Consolas,monospace" font-size="11" letter-spacing="1.4" fill="#666b65">DEPENDENCIES</text>
      <circle cx="1348" cy="465" r="3" fill="#a33d2b"/><text x="1358" y="469" font-size="12" fill="#a33d2b">Crossed</text>
      <text x="514" y="510" font-size="26" font-weight="500" letter-spacing="-.6">frontend.runtime-dependencies</text>
      <text x="514" y="541" font-size="15" fill="#666b65">The browser bundle uses React; new runtime packages</text><text x="514" y="565" font-size="15" fill="#666b65">require a separate decision.</text>
      <text x="514" y="604" font-size="12" fill="#666b65"><tspan font-weight="600" fill="#252825">Required</tspan><tspan>    ·    Native check    ·    1 file reported    ·    0 ms</tspan></text>
      <path d="M514 624H1388" stroke="#d9ddd5"/>
      <text x="514" y="655" font-size="11" letter-spacing="1.3" font-weight="600" fill="#666b65">EVIDENCE</text>
      <rect x="595" y="640" width="112" height="23" rx="3" fill="#eef0e9" stroke="#dce1d6"/><text x="605" y="655" font-size="10" fill="#4d594a">Not comparable</text>
      <rect x="514" y="678" width="122" height="28" rx="3" fill="#f1f2ed"/><text x="524" y="697" font-size="13" font-family="'SFMono-Regular',Consolas,monospace">package.json</text><text x="648" y="697" font-size="15" fill="#666b65">→</text><rect x="677" y="678" width="71" height="28" rx="3" fill="#f1f2ed"/><text x="687" y="697" font-size="13" font-family="'SFMono-Regular',Consolas,monospace">jquery</text>
      <text x="514" y="736" font-size="16">Direct dependency is not permitted: jquery</text>
      <path d="M514 756V808" stroke="#9cafa4" stroke-width="2"/>
      <text x="530" y="769" font-size="10" letter-spacing="1.3" font-weight="600" fill="#526658">NEXT STEP</text>
      <text x="530" y="794" font-size="13" fill="#4f5c50">Remove the new runtime dependency or propose a reviewed contract change.</text>
    </g>
    <text x="178" y="899" fill="#666b65" font-size="13">+  Report provenance</text><path d="M174 920H1426" stroke="#d9ddd5"/>
    <text x="174" y="948" fill="#666b65" font-size="11">Results apply only to the declared checks and recorded inputs.</text><text x="1426" y="948" fill="#666b65" text-anchor="end" font-size="11" font-family="'SFMono-Regular',Consolas,monospace">linebind / local report</text>
  </g>
  <text x="800" y="1052" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" fill="#3c5950" letter-spacing=".4">A real fixture result, illustrated. Your repository. Your contract.</text>
</svg>
