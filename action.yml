name: Set up Linebind
description: Install a checksum-pinned published Linebind verifier on Linux x64.
branding:
  icon: check-circle
  color: gray-dark
inputs:
  version:
    description: Exact published version; update sha256 together with this value.
    default: v0.5.0
  sha256:
    description: Independently reviewed SHA-256 of the Linux amd64 release archive.
    default: eaa31c3379a9031c6d2178125bb341b591600f6b150e19d8e6bde50c831cb1dc
outputs:
  binary:
    description: Absolute path to the verified executable, also added to PATH.
    value: ${{ steps.install.outputs.binary }}
runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        LINEBIND_ACTION_PATH: ${{ github.action_path }}
        LINEBIND_VERSION: ${{ inputs.version }}
        LINEBIND_SHA256: ${{ inputs.sha256 }}
      run: bash "$LINEBIND_ACTION_PATH/scripts/action/install.sh"
