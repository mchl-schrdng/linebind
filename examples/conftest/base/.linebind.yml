version: 1
name: Kubernetes Pod privileged-mode policy
rules:
  - id: no-privileged-containers
    kind: command
    reason: Each scoped document must be a Pod whose regular, init and ephemeral containers do not enable privileged mode.
    scope: ["infra/**/*.yaml", "infra/**/*.yml"]
    remediation: Supply a supported Pod, then omit privileged or set it to boolean false in every container group.
    command:
      argv: [conftest, test, infra, --policy, policy, --output, json]
      format: conftest
      timeout: 30
      policy-files: [policy/main.rego]
