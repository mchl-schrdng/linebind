version: 1
name: Orders transformation result
rules:
  - id: data.order-key-invariant
    kind: command
    reason: The SQL transformation must preserve exactly one row per input order, including its customer_id, on the approved test dataset.
    scope: [transform.sql]
    command:
      argv: [python3, -I, -B, checks/check_orders.py]
      timeout: 10
      success-codes: [0]
      failure-codes: [1]
      format: exit
      policy-files: [checks/check_orders.py, checks/orders.csv]
    remediation: Preserve every fixture order and its customer assignment without duplicate, null or invented keys; review changes to the checker or dataset separately.
