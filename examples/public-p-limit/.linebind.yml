version: 1
name: Linebind-authored p-limit pilot policy
rules:
  - id: pilot.esm-package
    kind: document
    reason: This pilot preserves the ESM package declaration observed at the pinned upstream revision.
    scope: [package.json]
    document:
      selector: /type
      equals: module
    remediation: Restore type=module; this is an experimental policy, not an upstream-maintained contract.
