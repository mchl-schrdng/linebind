version: 1
name: Linebind's own repository contract
rules:
  - id: public-entry-points
    kind: require-files
    reason: Contributors need product, licensing, configuration, security and contract-workflow documentation.
    remediation: Restore the missing public document or propose a reviewed contract update.
    files:
      require: [README.md, LICENSE, SECURITY.md, docs/configuration.md, docs/trust-model.md, docs/agents.md, docs/self-contract.md]
  - id: deliberate-direct-dependencies
    kind: dependencies
    reason: Keep the native verifier small and its direct dependencies explicit.
    scope: [go.mod]
    dependencies:
      format: go
      allow: [github.com/bmatcuk/doublestar/v4, go.yaml.in/yaml/v3, golang.org/x/mod]
  - id: pure-native-contract-package
    kind: forbid-text
    reason: Native contract evaluation inspects captured bytes without running project code or accessing the network.
    remediation: Keep side effects in the repository or application layer. This is a lexical check, including comments and strings.
    scope: [internal/contract/*.go]
    text:
      pattern: 'exec\.Command|http\.(Get|Post|Do)|os\.(ReadFile|Open|WriteFile)\('
  - id: bundled-agent-guidance
    kind: require-files
    reason: The binary ships the skill and its references so agent setup works offline.
    remediation: Restore the bundled guidance or propose a reviewed packaging decision.
    files:
      require:
        - internal/agentsetup/skill/SKILL.md
        - internal/agentsetup/skill/references/operations.md
        - internal/agentsetup/skill/references/authoring.md
  - id: report-network-references
    kind: forbid-text
    reason: The report is a standalone local HTML file with embedded assets and no network requirement.
    remediation: Embed the asset or keep the operation local. This lexical check includes comments and does not prove browser behavior.
    scope: [internal/report/report.html]
    text:
      pattern: >-
        (?i)(?:\b(?:src|href)\s*=\s*["']?\s*(?:https?:)?//|@import\b|url\s*\(\s*["']?\s*(?:https?:)?//|\b(?:fetch|WebSocket|EventSource|XMLHttpRequest)\s*\()
